spring:
  application:
    name: klassa-backend

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/klassa_dev}
    username: ${DB_USERNAME:klassa}
    password: ${DB_PASSWORD:klassa}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      pool-name: KlassaHikariPool

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        multiTenancy: SCHEMA
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: platform
    schemas: platform
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:klassa-super-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}
  expiration: 86400000
  cookie-name: klassa_token
  cookie-secure: false

cors:
  allowed-origins: "http://localhost:3000,http://localhost:5173,http://192.168.18.*:3000,http://192.168.18.*:5173"

storage:
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  access-key: ${STORAGE_ACCESS_KEY:minioadmin}
  secret-key: ${STORAGE_SECRET_KEY:minioadmin}
  bucket: ${STORAGE_BUCKET:klassa}
  public-url: ${STORAGE_PUBLIC_URL:http://localhost:9000}
  region: ${STORAGE_REGION:us-east-1}

platform:
  admin:
    email: ${PLATFORM_ADMIN_EMAIL:}
    password: ${PLATFORM_ADMIN_PASSWORD:}
    first-name: ${PLATFORM_ADMIN_FIRST_NAME:Platform}
    last-name: ${PLATFORM_ADMIN_LAST_NAME:Admin}

llm:
  provider: ${LLM_PROVIDER:anthropic}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-sonnet-5}

openrouter:
  api-key: ${OPENROUTER_API_KEY:}
  model: ${OPENROUTER_MODEL:openai/gpt-4o}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

---
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.klassa: DEBUG
    # Show SQL binding variable values in dev — useful for debugging query bugs,
    # noisy in prod so we leave it at WARN there.
    org.hibernate.orm.jdbc.bind: TRACE

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

management:
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10

  jpa:
    show-sql: false

jwt:
  cookie-secure: true

cors:
  allowed-origins: "https://app.klassa.com"

logging:
  level:
    # Prod: app stays at INFO; only WARN+ for third-party noise. The logback-spring.xml
    # profile block picks up this profile and swaps the human-readable pattern for the
    # logstash JSON encoder so stdout is one event per line.
    com.klassa: INFO
    root: WARN
