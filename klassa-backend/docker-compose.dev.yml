services:
  postgres:
    image: postgres:16-alpine
    container_name: klassa_postgres_dev
    environment:
      POSTGRES_DB: klassa_dev
      POSTGRES_USER: klassa
      POSTGRES_PASSWORD: klassa
    volumes:
      - klassa_pgdata_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klassa -d klassa_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: klassa_redis_dev
    volumes:
      - klassa_redis_data_dev:/data
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: klassa_minio_dev
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - klassa_minio_data_dev:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  klassa_pgdata_dev:
  klassa_redis_data_dev:
  klassa_minio_data_dev:
